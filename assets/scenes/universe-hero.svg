<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-labelledby="title desc">
  <title id="title">Welcome to Cappy's Universe</title>
  <desc id="desc">A curious astronaut cat floats above a small planet while stars shimmer and a comet crosses a cyan and violet night sky.</desc>
  <defs>
    <linearGradient id="sky" x2="1" y2="1"><stop stop-color="#101f2a"/><stop offset=".52" stop-color="#121724"/><stop offset="1" stop-color="#221d35"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#70e5ff"/><stop offset=".55" stop-color="#a6b8ff"/><stop offset="1" stop-color="#d3a7ff"/></linearGradient>
    <radialGradient id="nebula"><stop stop-color="#7f63cd" stop-opacity=".24"/><stop offset="1" stop-color="#7f63cd" stop-opacity="0"/></radialGradient>
    <linearGradient id="planet" x2=".8" y2="1"><stop stop-color="#697cbd"/><stop offset=".48" stop-color="#424666"/><stop offset="1" stop-color="#262c45"/></linearGradient>
    <linearGradient id="suit" x2="1" y2="1"><stop stop-color="#e9f2fc"/><stop offset="1" stop-color="#9aabc8"/></linearGradient>
    <linearGradient id="glass" x2="1" y2="1"><stop stop-color="#7bd9ff" stop-opacity=".13"/><stop offset="1" stop-color="#bb86fc" stop-opacity=".03"/></linearGradient>
    <linearGradient id="comet"><stop stop-color="#a6b8ff" stop-opacity="0"/><stop offset="1" stop-color="#cefaff"/></linearGradient>
    <clipPath id="frame"><rect x="1" y="1" width="898" height="318" rx="24"/></clipPath>
    <path id="star" d="M0-5 1.3-1.3 5 0 1.3 1.3 0 5-1.3 1.3-5 0-1.3-1.3Z"/>
  </defs>
  <style>
    @keyframes float { 0%,100% { transform:translateY(0) rotate(-3deg) } 50% { transform:translateY(-9px) rotate(2deg) } }
    @keyframes blink { 0%,43%,46%,100% { transform:scaleY(1) } 44.5% { transform:scaleY(.08) } }
    @keyframes shine { 0%,100% { opacity:.35 } 50% { opacity:.9 } }
    @keyframes drift { 0%,100% { transform:translate(0,0) } 50% { transform:translate(-22px,8px) } }
    @keyframes comet-pass { 0%,65% { opacity:0; transform:translate(-45px,-22px) } 68% { opacity:.8 } 79%,100% { opacity:0; transform:translate(110px,65px) } }
    @keyframes orbit { to { transform:rotate(360deg) } }
    .astronaut { animation:float 7s ease-in-out infinite; transform-origin:0 0 }
    .eyes { animation:blink 6.4s linear infinite; transform-box:fill-box; transform-origin:center }
    .twinkle { animation:shine 5s ease-in-out infinite }
    .late { animation-delay:-2.8s }
    .nebula { animation:drift 18s ease-in-out infinite }
    .comet { opacity:0; animation:comet-pass 14s ease-in-out infinite }
    .satellite { animation:orbit 30s linear infinite }
    @media(prefers-reduced-motion:reduce) { * { animation:none !important } .comet { opacity:0 } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="900" height="320" fill="url(#sky)"/>
    <ellipse class="nebula" cx="675" cy="170" rx="340" ry="260" fill="url(#nebula)"/>
    <g fill="none" stroke="#b8a2ff" stroke-opacity=".1">
      <ellipse cx="706" cy="171" rx="155" ry="133" transform="rotate(-28 706 171)"/>
      <ellipse cx="706" cy="171" rx="196" ry="167" transform="rotate(-28 706 171)"/>
      <path d="M0 290Q215 255 415 292T900 281"/>
    </g>
    <g fill="#a9bbd7" opacity=".65">
      <circle cx="40" cy="42" r="1"/><circle cx="229" cy="38" r="1.3"/><circle cx="453" cy="59" r="1"/>
      <circle cx="556" cy="44" r="1.3"/><circle cx="823" cy="104" r="1"/><circle cx="867" cy="238" r="1.4"/>
      <circle cx="520" cy="270" r="1"/><circle cx="386" cy="270" r="1.2"/><circle cx="62" cy="258" r="1"/>
      <circle cx="858" cy="37" r="1"/><circle cx="784" cy="277" r="1"/><circle cx="618" cy="237" r="1.2"/>
    </g>
    <g fill="#c6b2ff" class="twinkle"><use href="#star" x="542" y="108"/><use href="#star" x="837" y="176"/></g>
    <g fill="#a8edff" class="twinkle late"><use href="#star" x="788" y="46"/><use href="#star" x="457" y="220"/></g>
    <g transform="translate(450 32)"><g class="comet"><path d="M0 0 72 37" stroke="url(#comet)" stroke-width="2" stroke-linecap="round"/><circle cx="72" cy="37" r="2" fill="#d5f8ff"/></g></g>
    <path d="M57 63H83" stroke="#70e5ff" stroke-width="3" stroke-linecap="round"/>
    <text x="96" y="68" fill="#b1c5d7" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="2.2">FULL-STACK DEVELOPER</text>
    <g font-family="Segoe UI,Arial,sans-serif" font-weight="700" letter-spacing="-2">
      <text x="54" y="139" fill="#f0f6fc" font-size="60">Cappy's</text>
      <text x="54" y="205" fill="url(#accent)" font-size="68">Universe.</text>
    </g>
    <text x="58" y="247" fill="#acb8ce" font-family="Segoe UI,Arial,sans-serif" font-size="15" letter-spacing="2">CODE · COFFEE · CURIOSITY</text>
    <!-- A small satellite takes a slow, continuous orbit. -->
    <g transform="translate(706 171)"><g class="satellite"><circle cx="128" cy="0" r="5" fill="#79ddeb"/><circle cx="128" cy="0" r="9" fill="none" stroke="#79ddeb" stroke-opacity=".2"/></g></g>
    <ellipse cx="713" cy="290" rx="122" ry="17" fill="#080f1e" opacity=".4"/>
    <ellipse cx="716" cy="280" rx="71" ry="35" fill="url(#planet)" transform="rotate(-12 716 280)"/>
    <path d="M663 269Q698 247 749 267M671 290Q712 270 767 278" fill="none" stroke="#acb6e4" stroke-opacity=".18" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="716" cy="281" rx="102" ry="14" fill="none" stroke="#c2a0ec" stroke-opacity=".55" stroke-width="2" transform="rotate(-12 716 281)"/>
    <path d="M687 218C659 234 625 215 641 192S601 176 599 209" fill="none" stroke="#819ab4" stroke-width="2" stroke-linecap="round"/>
    <g transform="translate(712 161)"><g class="astronaut">
      <!-- Boots, arms and suit sit behind the glass helmet. -->
      <path d="M-19 60-28 78M19 60 29 75" stroke="#b5c4da" stroke-width="17" stroke-linecap="round"/>
      <path d="M-31 70-21 73M22 71 33 67" stroke="#798da9" stroke-width="5" stroke-linecap="round"/>
      <path d="M-30 22-49 37M30 22 49 9" stroke="url(#suit)" stroke-width="17" stroke-linecap="round"/>
      <path d="M48 8 50 0" stroke="#a7bfd5" stroke-width="12" stroke-linecap="round"/>
      <rect x="-35" y="5" width="70" height="63" rx="26" fill="url(#suit)"/>
      <rect x="-18" y="31" width="36" height="23" rx="8" fill="#36495e"/>
      <path d="M-9 42H4" stroke="#86edda" stroke-width="3" stroke-linecap="round"/><circle cx="10" cy="42" r="2" fill="#d4b5ff"/>
      <circle cy="-26" r="60" fill="#162437" stroke="#9ac3db" stroke-width="3"/>
      <!-- Cappy wears the same ginger coat inside the helmet. -->
      <g transform="translate(0 -4) scale(.92)">
      <path d="M-42-15Q-47-29-40-47L-34-66Q-32-71-28-67L-11-54Q0-57 11-54L28-67Q32-71 34-66L40-47Q47-29 42-15Q38 16 0 20Q-38 16-42-15Z" fill="#f4c58e" stroke="#65505a" stroke-width="3" stroke-linejoin="round"/>
      <path d="m-35-46 5-15 12 13q-10-2-17 2m53-2 12-13 5 15q-7-4-17-2" fill="#eeb0a0"/>
      <path d="m-14-48 3 8M0-51v10m14-7-3 8" fill="none" stroke="#d99a67" stroke-width="3.5" stroke-linecap="round"/>
      <ellipse cx="-26" cy="-4" rx="6" ry="3.5" fill="#eda59d" opacity=".55"/><ellipse cx="26" cy="-4" rx="6" ry="3.5" fill="#eda59d" opacity=".55"/>
      <path d="M-15-4Q0-11 15-4Q16 10 0 13Q-16 10-15-4Z" fill="#fff0d7"/>
      <g class="eyes"><ellipse cx="-16" cy="-19" rx="4.2" ry="6" fill="#443b46"/><ellipse cx="16" cy="-19" rx="4.2" ry="6" fill="#443b46"/><circle cx="-17" cy="-21" r="1.3" fill="#fff9eb"/><circle cx="15" cy="-21" r="1.3" fill="#fff9eb"/></g>
      <path d="M-4-7Q0-9 4-7Q4-4 0-2Q-4-4-4-7Z" fill="#b87879"/>
      <path d="M0-2v3m0 0q-3 5-7 1m7-1q3 5 7 1" fill="none" stroke="#74555b" stroke-width="1.8" stroke-linecap="round"/>
      <path d="m-31-9-13-3m13 10-12 1m75-8 12-3m-12 10 12 1" fill="none" stroke="#96727a" stroke-width="1.5" stroke-linecap="round"/>
    </g>
      <circle cy="-26" r="60" fill="url(#glass)"/>
      <path d="M-45-43Q-38-68-16-75" stroke="#def5ff" stroke-opacity=".65" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M38 4 43-3" stroke="#def5ff" stroke-opacity=".35" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M-30 26Q0 39 30 26" stroke="#7f9ab5" stroke-width="5" fill="none" stroke-linecap="round"/>
    </g></g>
  </g>
  <rect x="1" y="1" width="898" height="318" rx="24" fill="none" stroke="#6b87b3" stroke-opacity=".26"/>
</svg>
