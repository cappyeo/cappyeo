<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240" role="img" aria-labelledby="title desc">
  <title id="title">A cozy coding session</title>
  <desc id="desc">A ginger kitten sits behind a laptop with two short paws on the keyboard. A small terminal window, coffee and plant complete the desk.</desc>
  <style>
    @keyframes blink { 0%,42%,46%,100% { transform:scaleY(1) } 44% { transform:scaleY(.08) } }
    .blink { animation:blink 6s linear infinite; transform-box:fill-box; transform-origin:center }

    @keyframes typing { 0%,18%,40%,100% { transform:translateY(0) } 9%,29% { transform:translateY(2px) } }
    @keyframes steam { 0% { opacity:0; transform:translateY(3px) } 30% { opacity:.6 } 100% { opacity:0; transform:translate(3px,-10px) } }
    @keyframes code { 0%,20% { stroke-dashoffset:58 } 55%,85% { stroke-dashoffset:0 } 100% { stroke-dashoffset:58 } }
    .typing { animation:typing 3s ease-in-out infinite }
    .second { animation-delay:-.22s }
    .steam { animation:steam 4s ease-out infinite }
    .code { stroke-dasharray:58; animation:code 5s ease-in-out infinite }

    @media (prefers-reduced-motion:reduce) { * { animation:none !important } }
  </style>

    <ellipse cx="239" cy="212" rx="199" ry="8" fill="#77849e" opacity=".12"/>
    <path d="M47 211H434" stroke="#76819a" stroke-width="2" stroke-linecap="round"/>
    <!-- The head, shoulders and short forelegs stay connected behind the laptop. -->
    <path d="M210 106Q199 132 205 177H275Q281 132 270 106Z" fill="#f4c58e" stroke="#65505a" stroke-width="3"/>
    <path d="M212 130Q196 133 190 147M268 130Q284 133 290 147" fill="none" stroke="#65505a" stroke-width="19" stroke-linecap="round"/>
    <path d="M212 130Q196 133 190 147M268 130Q284 133 290 147" fill="none" stroke="#f4c58e" stroke-width="13" stroke-linecap="round"/>
    <g transform="translate(240 100)">
      <path d="M-42-15Q-47-29-40-47L-34-66Q-32-71-28-67L-11-54Q0-57 11-54L28-67Q32-71 34-66L40-47Q47-29 42-15Q38 16 0 20Q-38 16-42-15Z" fill="#f4c58e" stroke="#65505a" stroke-width="3" stroke-linejoin="round"/>
      <path d="m-35-46 5-15 12 13q-10-2-17 2m53-2 12-13 5 15q-7-4-17-2" fill="#eeb0a0"/>
      <path d="m-14-48 3 8M0-51v10m14-7-3 8" fill="none" stroke="#d99a67" stroke-width="3.5" stroke-linecap="round"/>
      <ellipse cx="-26" cy="-4" rx="6" ry="3.5" fill="#eda59d" opacity=".55"/><ellipse cx="26" cy="-4" rx="6" ry="3.5" fill="#eda59d" opacity=".55"/>
      <path d="M-15-4Q0-11 15-4Q16 10 0 13Q-16 10-15-4Z" fill="#fff0d7"/>
      <g class="blink"><ellipse cx="-16" cy="-19" rx="4.2" ry="6" fill="#443b46"/><ellipse cx="16" cy="-19" rx="4.2" ry="6" fill="#443b46"/><circle cx="-17" cy="-21" r="1.3" fill="#fff9eb"/><circle cx="15" cy="-21" r="1.3" fill="#fff9eb"/></g>
      <path d="M-4-7Q0-9 4-7Q4-4 0-2Q-4-4-4-7Z" fill="#b87879"/>
      <path d="M0-2v3m0 0q-3 5-7 1m7-1q3 5 7 1" fill="none" stroke="#74555b" stroke-width="1.8" stroke-linecap="round"/>
      <path d="m-31-9-13-3m13 10-12 1m75-8 12-3m-12 10 12 1" fill="none" stroke="#96727a" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <!-- The viewer sees the back of the laptop lid; code appears in a separate terminal. -->
    <path d="M181 134H299Q304 134 305 140L317 193Q318 198 312 198H168Q162 198 163 193L175 140Q176 134 181 134Z" fill="#2d3850" stroke="#8090af" stroke-width="3"/>
    <path d="M184 140H296" stroke="#b1c0d7" stroke-opacity=".35" stroke-width="2" stroke-linecap="round"/>
    <path d="m232 159-10 9 10 9m16-18 10 9-10 9" fill="none" stroke="#99dbe9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="154" y="197" width="172" height="8" rx="4" fill="#9eabc1" stroke="#596780" stroke-width="2"/>
    <path d="M226 201h28" stroke="#65748e" stroke-width="2" stroke-linecap="round"/>
    <g class="typing"><ellipse cx="190" cy="145" rx="10" ry="7" fill="#f4c58e" stroke="#65505a" stroke-width="2.5"/><path d="M187 142v4m5-4v4" stroke="#cf946d" stroke-width="1.3" stroke-linecap="round"/></g>
    <g class="typing second"><ellipse cx="290" cy="145" rx="10" ry="7" fill="#f4c58e" stroke="#65505a" stroke-width="2.5"/><path d="M287 142v4m5-4v4" stroke="#cf946d" stroke-width="1.3" stroke-linecap="round"/></g>
    <!-- A small, separate terminal keeps the character's face uncluttered. -->
    <rect x="341" y="49" width="94" height="66" rx="9" fill="#192333" stroke="#576783" stroke-width="1.5"/>
    <path d="M341 66h94" stroke="#394a65"/><circle cx="352" cy="58" r="2" fill="#e7ac9d"/><circle cx="359" cy="58" r="2" fill="#e6d098"/><circle cx="366" cy="58" r="2" fill="#94c6af"/>
    <path d="m352 77 4 3-4 3m12-3h18M353 92h21" fill="none" stroke="#93d6df" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="code" d="M380 92h38m-55 10h44" fill="none" stroke="#bea7e9" stroke-width="2" stroke-linecap="round"/>
    <path d="M374 115v16q0 5-5 5h-31" fill="none" stroke="#596b88" stroke-width="1.5" stroke-dasharray="3 5"/>
    <!-- Coffee cup: both wisps rise from the opening of the cup. -->
    <path d="M91 178h28v19q0 9-14 9t-14-9Z" fill="#eac0a4" stroke="#7d6064" stroke-width="2.5"/>
    <ellipse cx="105" cy="178" rx="14" ry="4" fill="#805c58" stroke="#7d6064" stroke-width="2"/>
    <path d="M120 182q15-2 12 9-2 6-12 6" fill="none" stroke="#7d6064" stroke-width="3"/>
    <path d="M102 170q-5-8 0-16" class="steam" fill="none" stroke="#b6c0d1" stroke-width="2" stroke-linecap="round"/>
    <path d="M111 169q-4-7 1-13" class="steam" style="animation-delay:-2s" fill="none" stroke="#b6c0d1" stroke-width="2" stroke-linecap="round"/>
    <!-- The plant has a stem, leaves and a stable pot. -->
    <path d="M383 186v-28" fill="none" stroke="#669b8a" stroke-width="2.5"/>
    <path d="M383 175q-18 0-18-13 15-2 18 13m0-7q16 0 17-14-14 0-17 14m0-8q-9-8-3-18 10 6 3 18" fill="#93c6a7" stroke="#5b8f80" stroke-width="1.5"/>
    <path d="M369 185h28l-4 21h-20Z" fill="#ca947e" stroke="#785d67" stroke-width="2"/><path d="M368 184h30" stroke="#e3b7a0" stroke-width="4" stroke-linecap="round"/>

</svg>
