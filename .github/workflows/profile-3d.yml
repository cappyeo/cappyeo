name: Generate 3D Contribution Graph

on:
  schedule:
    - cron: "0 6 * * *" # Runs daily at 06:00 UTC (avoid race with snake/metrics)
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: profile-3d
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    name: Generate 3D Profile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate 3D Contribution
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          # A personal token lets the generator read this account's private contribution calendar.
          # The default workflow token only receives the public calendar.
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Keep only used SVG
        run: |
          find profile-3d-contrib -type f -name '*.svg' ! -name 'profile-night-green.svg' -delete

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p "$RUNNER_TEMP/profile-3d-contrib"
          cp profile-3d-contrib/profile-night-green.svg "$RUNNER_TEMP/profile-3d-contrib/profile-night-green.svg"

          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p profile-3d-contrib
            cp "$RUNNER_TEMP/profile-3d-contrib/profile-night-green.svg" profile-3d-contrib/profile-night-green.svg
            find profile-3d-contrib -type f -name '*.svg' ! -name 'profile-night-green.svg' -delete

            git add -A profile-3d-contrib/
            if git diff --cached --quiet; then
              echo "No changes to commit"
              exit 0
            fi
            git commit -m "chore: update 3D contribution graph"
            git push origin HEAD:main && exit 0
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
          echo "Push failed after 3 attempts"
          exit 1
