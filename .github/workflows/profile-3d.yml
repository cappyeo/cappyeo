name: Generate 3D Contribution Graph

on:
  schedule:
    - cron: "0 6 * * *" # Runs daily at 06:00 UTC (avoid race with snake/metrics)
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: profile-3d
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    name: Generate 3D Profile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select contribution token
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          DEFAULT_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$METRICS_TOKEN" ] && curl --fail --silent --show-error \
            --retry 2 \
            --header "Authorization: Bearer $METRICS_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/user >/dev/null; then
            echo "PROFILE_TOKEN=$METRICS_TOKEN" >> "$GITHUB_ENV"
            echo "Using METRICS_TOKEN for the private contribution calendar."
          else
            echo "::warning::METRICS_TOKEN is missing or invalid; generating the public contribution calendar with the default Actions token."
            echo "PROFILE_TOKEN=$DEFAULT_TOKEN" >> "$GITHUB_ENV"
          fi

      - name: Diagnose contribution data
        env:
          PROFILE_TOKEN: ${{ env.PROFILE_TOKEN }}
          TARGET_USERNAME: ${{ github.repository_owner }}
        run: |
          query='query($login: String!) { viewer { login } user(login: $login) { login contributionsCollection { contributionCalendar { totalContributions } } } }'
          payload=$(jq -nc --arg query "$query" --arg login "$TARGET_USERNAME" '{query: $query, variables: {login: $login}}')

          if ! response=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $PROFILE_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            https://api.github.com/graphql); then
            echo "::warning::Unable to query contribution diagnostics."
            exit 0
          fi

          token_owner=$(jq -r '.data.viewer.login // empty' <<< "$response")
          target_owner=$(jq -r '.data.user.login // empty' <<< "$response")
          total=$(jq -r '.data.user.contributionsCollection.contributionCalendar.totalContributions // empty' <<< "$response")

          if [ -z "$token_owner" ] || [ -z "$target_owner" ] || [ -z "$total" ]; then
            echo "::warning::GitHub did not return complete contribution diagnostics."
            exit 0
          fi

          echo "Contribution diagnostics: token owner=$token_owner; target=$target_owner; total=$total"
          if [ "$token_owner" != "$TARGET_USERNAME" ]; then
            echo "::warning::METRICS_TOKEN belongs to $token_owner, not $TARGET_USERNAME."
          fi

      - name: Generate 3D Contribution
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          # A valid personal token includes private contributions; the workflow
          # falls back to the default token when it is unavailable or invalid.
          GITHUB_TOKEN: ${{ env.PROFILE_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Keep only used SVG
        run: |
          find profile-3d-contrib -type f -name '*.svg' ! -name 'profile-night-green.svg' -delete

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p "$RUNNER_TEMP/profile-3d-contrib"
          cp profile-3d-contrib/profile-night-green.svg "$RUNNER_TEMP/profile-3d-contrib/profile-night-green.svg"

          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p profile-3d-contrib
            cp "$RUNNER_TEMP/profile-3d-contrib/profile-night-green.svg" profile-3d-contrib/profile-night-green.svg
            find profile-3d-contrib -type f -name '*.svg' ! -name 'profile-night-green.svg' -delete

            git add -A profile-3d-contrib/
            if git diff --cached --quiet; then
              echo "No changes to commit"
              exit 0
            fi
            git commit -m "chore: update 3D contribution graph"
            git push origin HEAD:main && exit 0
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
          echo "Push failed after 3 attempts"
          exit 1
